[project]
name = "Polyboard_Backend"
version = "0.1.0"
description = "This is the FastAPI backend for Polyboard, the interlingual whiteboard."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic>=2.12.3",
    "uvicorn[standard]>=0.37.0",
    "httpx>=0.24.0",
    "pillow>=12.0.0",
    "boto3>=1.41.5",
    "python-dotenv>=1.2.2",
]
